{% extends "Base_Pag.html" %}

{% block titulo %}Detalhar Diretor{% endblock titulo %}

{% block conteudo %}
<div class="link_titulo">
    <h1>Diretor: {{var_diretores.nome_diretor}}</h1>
</div>

<div class="cards">
    {% for filme in var_filmes %}
    <div class="filmes_cadastrado">
        <a href="{{url_for('info_filme', var_id = filme.id_filme)}}"><img src="{{filme.imagem}}" alt="{{filme.nome_filme}}" width="245px" height="130px"></a>
    </div>
    {% endfor %}
</div>

{% endblock conteudo %}
