{% extends "Base_Pag.html" %}

{% block titulo %}Cadastrar Gênero{% endblock titulo %}

{% block conteudo %}
<div class="formulario">
    <div class="fundo_formulario">
        <form class="form_cadastro" action="{{url_for('cadastro_genero')}}" method="post">
            <div class="form_cadastro_title">
                <h1>Cadastrar usuario:</h1>
                <label>
                    Nome do Gênero:
                    <input type="text" name="form_nome_genero" placeholder="Digite o Nome do Gênero" required>
                </label>
                <div class="botoes">
                    <button type="submit" class="botao_input_style">Cadastrar</button>
                    <button type="reset" class="botao_input_style">Limpar</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock conteudo %}
