{% extends "base_pag.html" %}

{% block conteudo %}

<h2>Resultados da pesquisa por: "{{ termo }}"</h2>

{% if var_filmes %}
{% for filme in var_filmes %}
<div class="cards">
    {% for filme in var_filmes %}
    <div class="filmes_cadastrado">
        <a href="{{url_for('info_filme', var_id = filme.id_filme)}}"><img src="{{filme.imagem}}"
                                                                          alt="{{filme.nome_filme}}" width="245px"
                                                                          height="130px"></a>
    </div>
    {% endfor %}
</div>
{% endfor %}

{% else %}
<p>Nenhum filme encontrado.</p>
{% endif %}
<div class=links_filmes>
<a href="{{ url_for('listar_filmes') }}">Voltar</a>
</div>
{% endblock %}
