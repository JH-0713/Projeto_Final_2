{% extends "Base_Pag.html" %}

{% block titulo %}Cadastrar Filme{% endblock titulo %}

{% block conteudo %}
<div class="formulario">
    <div class="fundo_formulario">
        <h2>Cadastrar Filme</h2>
        <form action="{{url_for('cadastrar_filme')}}" method="post">
            <label>
                Título:
                <input type="text" name="form_titulo" placeholder="Título do filme" required>
            </label>
            <label>
                Tempo de Duração:
                <input type="text" name="form_duracao" placeholder="Ex: 2h 15min" required>
            </label>
            <label>
                Descrição:
                <textarea name="form_descricao" placeholder="Descreva o filme" rows="5" required></textarea>
            </label>
            <label>
                Imagem (URL):
                <input type="text" name="form_imagem" placeholder="Link do imagem">
            </label>
            <label>
                Data de Lançamento:
                <input type="text" name="form_lancamento" placeholder="Ex: XX/XX(ou nome do mes)/XXXX" required>
            </label>
            <div class="botoes">
                <button type="reset" class="botao_input_style">Limpar</button>
                <button type="submit" class="botao_input_style">Cadastrar</button>
            </div>
        </form>
    </div>
</div>
{% endblock conteudo %}
