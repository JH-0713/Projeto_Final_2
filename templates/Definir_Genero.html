{% extends "Base_Pag.html" %}

{% block titulo %}Definir Gênero(s){% endblock titulo %}

{% block conteudo %}

<div class="formulario">
    <div class="fundo_formulario">
        <form class="form_cadastro" action="{{ url_for('definir_genero', var_id=var_id_f) }}" method="post">
            <div class="form_cadastro_title">
                <h1>Definir Gênero:</h1>
                {% for genero in var_generos %}
                <label>
                    <input type="checkbox" name="form_genero" value="{{ genero.id_genero }}">
                    {{ genero.nome_genero }}
                </label>
                {% endfor %}
                <div class="botoes">
                    <button type="submit" class="botao_input_style">Definir</button>
                    <a href="{{url_for('cadastro_genero')}}" class="botao_input_style">Adicionar Gênero</a>
                </div>
            </div>
        </form>
    </div>
</div>

{% endblock conteudo %}
