{% extends "Base_Pag.html" %}

{% block titulo %}Gêneros{% endblock titulo %}

{% block conteudo %}
<div class="links">
    <div class="link_titulo">
        <h1>Gêneros</h1>
        <a href="{{url_for('cadastro_genero')}}">Adicionar Gênero</a>
    </div>
</div>
<div class="escolha">
    {% for genero in var_generos %}
    <a href="{{url_for('detalhar_genero', var_id = genero.id_genero)}}">{{genero.nome_genero}}</a>
    {% endfor %}
</div>
{% endblock conteudo %}
