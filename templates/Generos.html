{% extends "base_pag.html" %}

{% block conteudo %}
<div class="genero">
    <div class="genero_titulo">
        <h1>Generos</h1>
        <a href="#">Adicionar Genero</a>
    </div>
</div>
<div class="escolha">

    {% endfor %}
</div>
{% endblock conteudo %}
