<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Base PAG</title>
    <link rel="stylesheet" href="/static/css/Pag_Filmes.css">
</head>

<body>
<div class="body_main">
    <div class="header">
        <div class="titulo">
            <img src="/static/img/logo.png" alt="slogam" class="logo">
        </div>
        <nav class="lista">
            <a href="{{url_for('listar_filmes')}}">Filmes</a>
            <a href="{{url_for('get_generos')}}">Generos</a>
            <a href="#">Diretores</a>
            <a href="#">Atores</a>
            <a href="{{url_for('cadastrar_filme')}}">Cadastrar filme</a>
        </nav>
        <div class="pesquisa">
            <img src="/static/img/lupa.png" alt="lupa" class="lupa">
            <input class="barra" type="search" placeholder="Pesquise...">
        </div>
        <img src="/static/img/user.png" alt="user" class="user">
    </div>
    {% block conteudo %}
    {% endblock conteudo %}
</div>
</body>
</html>
