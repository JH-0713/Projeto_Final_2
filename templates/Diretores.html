{% extends "Base_Pag.html" %}

{% block titulo %}Diretores{% endblock titulo %}

{% block conteudo %}
<div class="links">
    <div class="link_titulo">
        <h1>Diretores</h1>
        <a href="{{url_for('cadastro_diretor')}}">Adicionar Diretor</a>
    </div>
</div>
<div class="escolha">
    {% for diretor in var_diretores %}
    <a href="{{url_for('detalhar_diretor', var_id = diretor.id_diretor)}}">{{diretor.nome_diretor}}</a>
    {% endfor %}
</div>
{% endblock conteudo %}
